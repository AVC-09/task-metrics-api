name: CI/CD Pipeline - Task & Metrics API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions needed for OIDC Token generation and ECR authentication
permissions:
  id-token: write # Required for requesting the AWS JWT
  contents: read  # Required for checkout

jobs:
  lint-and-build:
    name: Build ARM64 Image & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::380973360725:role/dev-github-actions-ecr-role
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dev-task-metrics-api:latest
            ${{ steps.login-ecr.outputs.registry }}/dev-task-metrics-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max