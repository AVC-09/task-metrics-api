name: CI/CD Pipeline - Task & Metrics API

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write # Required to request the JWT token for AWS OIDC authentication
  contents: read  # Required to checkout the repository code

jobs:
  validate-and-publish:
    name: Lint, Build ARM64 & Push to ECR
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Helm CLI and validate chart syntax/templates
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: |
          helm lint ./helm/task-metrics-app

      # Step 3: Set up Docker Buildx for cross-platform ARM64 (Graviton) compilation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Authenticate to AWS via IAM OIDC Role (Executes only on pushes to main)
      - name: Configure AWS Credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::380973360725:role/dev-github-actions-ecr-role
          aws-region: eu-west-1

      # Step 5: Authenticate Docker CLI against Amazon ECR Registry (Executes only on pushes to main)
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Build ARM64 Docker image and push to ECR with GitHub Actions cache
      - name: Build and Push Docker Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dev-task-metrics-api:latest
            ${{ steps.login-ecr.outputs.registry }}/dev-task-metrics-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max