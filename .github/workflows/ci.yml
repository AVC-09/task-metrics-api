name: Continuous Integration (CI)

# Trigger the workflow on pushes or pull requests to main/feature branches
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download code from repository
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up Helm tool in the virtual machine
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # Step 3: Lint Helm Chart syntax and templates
      - name: Lint Helm Chart
        run: |
          helm lint ./helm/task-metrics-app

      # Step 4: Set up Docker Buildx for optimized compilation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Test building the Docker image
      - name: Build Docker Image
        run: |
          docker build -t task-api:test .